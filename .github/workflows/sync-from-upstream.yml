name: Sync from upstream

# TEMPLATE — copy to <mirror>/.github/workflows/sync-from-upstream.yml
#
# Reconciles a standalone mirror against the merged monorepo state. This is what
# delivers the two things Raycast CI produces ONLY on merge: recompressed
# screenshots and the stamped {PR_MERGE_DATE}.
#
# STAGGER THE CRON MINUTE per repo. GitHub queues same-minute schedules across
# all of Actions, and scheduled runs are already best-effort under load.

on:
  # Without a schedule this only fires if something dispatches it — and when
  # that something is missing, the mirror drifts silently for months. Verified
  # 2026-07-31 on raycast-karakeep: zero runs since the workflow was added,
  # which is why its tree was three upstream commits behind. A daily run is a
  # no-op when there is nothing new.
  schedule:
    - cron: "20 9 * * *"
  repository_dispatch:
    types: [upstream-sync]
  workflow_dispatch:
    inputs:
      ext_dir:
        description: "Override monorepo directory name (extensions/<ext_dir>) if it differs from package.json name"
        required: false

# Set UPSTREAM_EXT_DIR in repo-level env vars to permanently override the
# monorepo directory name when it differs from the package.json name field.
# e.g. for chrismessina/raycast-reader: UPSTREAM_EXT_DIR = reader-mode
env:
  UPSTREAM_EXT_DIR: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read extension name from package.json
        id: meta
        run: |
          NAME=$(jq -r '.name' package.json)
          # Use override if provided (dispatch payload > workflow input > env var > package.json name)
          OVERRIDE="${{ github.event.client_payload.ext_name }}"
          if [ -z "$OVERRIDE" ]; then OVERRIDE="${{ inputs.ext_dir }}"; fi
          if [ -z "$OVERRIDE" ]; then OVERRIDE="${UPSTREAM_EXT_DIR}"; fi
          if [ -n "$OVERRIDE" ]; then NAME="$OVERRIDE"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download extension files from upstream monorepo
        # Explicit bash: uses pipefail and process substitution.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXT_NAME="${{ steps.meta.outputs.name }}"
          REPO="raycast/extensions"
          MANIFEST="$RUNNER_TEMP/synced-files.txt"
          : > "$MANIFEST"

          # Resolve the extension's OWN subtree, then list it in one recursive
          # call. An earlier version walked the contents API directory by
          # directory and issued a request per file — ~85 for a mid-size
          # extension — which trips secondary rate limits against a repo the
          # default GITHUB_TOKEN doesn't own. Verified 2026-07-31: karakeep run
          # 30660911758 failed partway through exactly this walk.
          COMMIT=$(gh api "repos/${REPO}/commits?path=extensions/${EXT_NAME}&per_page=1" --jq '.[0].sha')
          [ -n "$COMMIT" ] || { echo "Could not resolve upstream commit"; exit 1; }
          ROOT_TREE=$(gh api "repos/${REPO}/commits/${COMMIT}" --jq '.commit.tree.sha')
          EXTS_TREE=$(gh api "repos/${REPO}/git/trees/${ROOT_TREE}" --jq '.tree[] | select(.path=="extensions") | .sha')
          EXT_TREE=$(gh api "repos/${REPO}/git/trees/${EXTS_TREE}" --jq ".tree[] | select(.path==\"${EXT_NAME}\") | .sha")
          [ -n "$EXT_TREE" ] || { echo "Extension ${EXT_NAME} not found upstream"; exit 1; }

          TREE_JSON=$(gh api "repos/${REPO}/git/trees/${EXT_TREE}?recursive=1")

          # A truncated tree silently OMITS entries. Those omissions would then
          # read as "upstream no longer serves this file" and be deleted. The
          # WHOLE-REPO recursive call DOES truncate on this monorepo — verified
          # 2026-07-31 — which is why the call is scoped to the extension
          # subtree. Assert rather than assume; fail closed.
          [ "$(jq -r '.truncated' <<<"$TREE_JSON")" = "false" ] || {
            echo "ABORT: upstream tree response was truncated; refusing to sync a partial file list."
            exit 1
          }

          jq -r '.tree[] | select(.type=="blob") | .path' <<<"$TREE_JSON" > "$RUNNER_TEMP/upstream-paths.txt"
          EXPECTED=$(wc -l < "$RUNNER_TEMP/upstream-paths.txt" | tr -d ' ')
          echo "upstream serves $EXPECTED files"

          # Fetch contents from raw.githubusercontent (no API quota) pinned to
          # the resolved commit, so every file comes from ONE consistent
          # snapshot.
          while read -r path; do
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/${REPO}/${COMMIT}/extensions/${EXT_NAME}/${path}" \
              -o "$path" || { echo "ABORT: failed to download $path"; exit 1; }
            printf '%s\n' "$path" >> "$MANIFEST"
            echo "  downloaded: $path"
          done < "$RUNNER_TEMP/upstream-paths.txt"

          # Every advertised file must have landed. A short manifest is what the
          # deletion pass would misread as upstream removals.
          ACTUAL=$(wc -l < "$MANIFEST" | tr -d ' ')
          [ "$ACTUAL" -eq "$EXPECTED" ] || {
            echo "ABORT: downloaded $ACTUAL of $EXPECTED files."
            exit 1
          }
          echo "downloaded $ACTUAL/$EXPECTED files"

      - name: Commit and push if changed
        # Explicit bash: the deletion loop uses process substitution.
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage ONLY the files this run downloaded. `git add -A` would also
          # commit anything else in the tree — an uncommitted local edit, an
          # untracked CLAUDE.md, a scratch file — into an automated commit
          # nobody reviews.
          MANIFEST="$RUNNER_TEMP/synced-files.txt"
          if [ ! -s "$MANIFEST" ]; then
            echo "No files were downloaded; nothing to stage."
            exit 0
          fi
          sort -u "$MANIFEST" -o "$MANIFEST"
          tr '\n' '\0' < "$MANIFEST" | xargs -0 git add --

          # Propagate upstream deletions, but only for files under a directory
          # this sync populates. A tracked file elsewhere (AGENTS.md, CLAUDE.md,
          # .github/) is local-only by design and must survive.
          #
          # Only DIRECTORIES may contribute. A root-level file's `cut -d/ -f1`
          # is the file itself, which previously made every root file a deletion
          # candidate — verified 2026-07-31: karakeep run 30651601868 removed
          # package.json, tsconfig.json, README.md, AGENTS.md and the workflow
          # itself while reporting success.
          SYNCED_DIRS=$(grep '/' "$MANIFEST" | cut -d/ -f1 | sort -u)

          # Refuse to prune on an implausibly small manifest. If the download
          # partially failed, "upstream no longer serves it" is indistinguishable
          # from "we failed to fetch it" — and the difference is the whole repo.
          MANIFEST_COUNT=$(wc -l < "$MANIFEST" | tr -d ' ')
          if [ "$MANIFEST_COUNT" -lt 10 ]; then
            echo "Manifest has only $MANIFEST_COUNT files — refusing to propagate deletions."
          elif [ -z "$SYNCED_DIRS" ]; then
            echo "No synced subdirectories — nothing to prune."
          else
            while read -r tracked; do
              if ! grep -Fxq "$tracked" "$MANIFEST"; then
                echo "  upstream no longer serves: $tracked"
                git rm -q --cached --ignore-unmatch -- "$tracked"
                rm -f -- "$tracked"
              fi
            done < <(git ls-files -- $SYNCED_DIRS)
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            PR_NUMBER="${{ github.event.client_payload.pr_number }}"
            PR_URL="${{ github.event.client_payload.pr_url }}"
            MSG="chore: sync from upstream raycast/extensions"
            if [ -n "$PR_NUMBER" ]; then
              MSG="$MSG (raycast/extensions#${PR_NUMBER})"
            fi
            git commit -m "$MSG"
            git push
          fi
