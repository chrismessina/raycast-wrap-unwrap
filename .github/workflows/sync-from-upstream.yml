name: Sync from upstream

# TEMPLATE — copy to <mirror>/.github/workflows/sync-from-upstream.yml
#
# Reconciles a standalone mirror against the merged monorepo state, delivering
# the two things Raycast CI produces ONLY on merge (the stamped {PR_MERGE_DATE}
# and recompressed screenshots) plus any changes a contributor merged upstream.
#
# ── THE RULE THIS WORKFLOW EXISTS TO ENFORCE ────────────────────────────────
#
#   It NEVER pushes to main, and it NEVER overwrites a file you changed
#   locally. Every incoming change arrives as a pull request.
#
# The previous version did the opposite: it downloaded each upstream file and
# committed it unconditionally. That silently reverted local-only work — on
# 2026-08-01 it undid a README fix (a dead docs/shelf.md link) by restoring the
# monorepo's older copy, and reported success. The bug was not the cron
# schedule; it was overwriting without comparing. A merge-triggered sync running
# that same code would lose the same edit, just less often — which is worse,
# because rare corruption is the kind you stop watching for.
#
# ── HOW IT DECIDES ──────────────────────────────────────────────────────────
#
# Three-way compare per file, against .github/upstream-sync-state.json (the
# upstream blob SHAs recorded at the last successful sync):
#
#   upstream changed?  mirror changed?  →  action
#   ─────────────────  ───────────────     ─────────────────────────────────
#   no                 no                  nothing
#   yes                no                  take upstream (stamp, PNGs, fixes)
#   no                 yes                 KEEP YOURS  ← the README case
#   yes                yes                 CONFLICT → open an issue, sync nothing
#   yes                yes                 … except CHANGELOG.md differing ONLY
#                                          by the {PR_MERGE_DATE} stamp → take
#                                          upstream (that stamp is the point)
#   package-lock.json  —                   NOT compared. Derived from
#                                          package.json; regenerated when
#                                          package.json is taken.
#   DELETED upstream   no                  propagate the deletion
#   DELETED upstream   yes                 KEEP YOURS (it becomes local-only)
#
# Row 3 is what used to lose. Row 4 is genuinely ambiguous and must never be
# resolved by a script.
#
# The two DELETED rows are computed from the baseline, not from the upstream
# listing — the listing only says what exists now, so a removed file is
# invisible to it. See the deletion block in the compare step.
#
# STAGGER THE CRON MINUTE per repo. GitHub queues same-minute schedules across
# all of Actions, and scheduled runs are already best-effort under load.

on:
  # The cron is the SAFETY NET, not the primary path. A merge-triggered sync
  # only fires for merges you know about — which excludes the case that matters
  # most: someone else's PR to your extension merging upstream without you
  # being the author. That is precisely when a mirror drifts unnoticed, so the
  # unconditional daily check stays.
  schedule:
    - cron: "20 9 * * *"
  # Fired by `ship`'s post-merge step (or `gh workflow run`) for an immediate
  # sync after your own PR merges, instead of waiting up to 24h.
  repository_dispatch:
    types: [upstream-sync]
  workflow_dispatch:
    inputs:
      ext_dir:
        description: "Override monorepo directory name (extensions/<ext_dir>) if it differs from package.json name"
        required: false

# Set UPSTREAM_EXT_DIR in repo-level env vars to permanently override the
# monorepo directory name when it differs from the package.json name field.
# e.g. for chrismessina/raycast-reader: UPSTREAM_EXT_DIR = reader-mode
env:
  UPSTREAM_EXT_DIR: ""
  STATE_FILE: .github/upstream-sync-state.json

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read extension name from package.json
        id: meta
        run: |
          NAME=$(jq -r '.name' package.json)
          # dispatch payload > workflow input > env var > package.json name
          OVERRIDE="${{ github.event.client_payload.ext_name }}"
          if [ -z "$OVERRIDE" ]; then OVERRIDE="${{ inputs.ext_dir }}"; fi
          if [ -z "$OVERRIDE" ]; then OVERRIDE="${UPSTREAM_EXT_DIR}"; fi
          if [ -n "$OVERRIDE" ]; then NAME="$OVERRIDE"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream file list and compare
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXT_NAME="${{ steps.meta.outputs.name }}"
          REPO="raycast/extensions"

          # Resolve the extension's OWN subtree, then list it in one recursive
          # call. Walking the contents API directory by directory issues a
          # request per file — ~85 for a mid-size extension — which trips
          # secondary rate limits against a repo the default GITHUB_TOKEN does
          # not own. (Verified 2026-07-31: karakeep run 30660911758 failed
          # partway through exactly that walk.)
          COMMIT=$(gh api "repos/${REPO}/commits?path=extensions/${EXT_NAME}&per_page=1" --jq '.[0].sha')
          [ -n "$COMMIT" ] || { echo "Could not resolve upstream commit"; exit 1; }
          ROOT_TREE=$(gh api "repos/${REPO}/commits/${COMMIT}" --jq '.commit.tree.sha')
          EXTS_TREE=$(gh api "repos/${REPO}/git/trees/${ROOT_TREE}" --jq '.tree[] | select(.path=="extensions") | .sha')
          EXT_TREE=$(gh api "repos/${REPO}/git/trees/${EXTS_TREE}" --jq ".tree[] | select(.path==\"${EXT_NAME}\") | .sha")
          [ -n "$EXT_TREE" ] || { echo "Extension ${EXT_NAME} not found upstream"; exit 1; }

          TREE_JSON=$(gh api "repos/${REPO}/git/trees/${EXT_TREE}?recursive=1")

          # A truncated tree silently OMITS entries, which would read as
          # "upstream no longer serves this file" and become deletions. The
          # whole-repo recursive call DOES truncate on this monorepo (verified
          # 2026-07-31), which is why this is scoped to the extension subtree.
          # Assert rather than assume; fail closed.
          [ "$(jq -r '.truncated' <<<"$TREE_JSON")" = "false" ] || {
            echo "ABORT: upstream tree response was truncated; refusing to sync a partial file list."
            exit 1
          }

          # path -> upstream blob SHA. This is the whole basis of the compare:
          # a git blob SHA is content-addressed, so "changed" is exact.
          jq -r '.tree[] | select(.type=="blob") | "\(.path)\t\(.sha)"' <<<"$TREE_JSON" \
            | sort > "$RUNNER_TEMP/upstream.tsv"

          echo "upstream serves $(wc -l < "$RUNNER_TEMP/upstream.tsv" | tr -d ' ') files"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

          # Baseline: what upstream served at the LAST sync. Absent on first
          # run — then every upstream file is "new", and a mirror file that
          # differs is treated as locally-modified (conservative: we keep it).
          if [ -f "$STATE_FILE" ]; then
            jq -r '.files | to_entries[] | "\(.key)\t\(.value)"' "$STATE_FILE" | sort > "$RUNNER_TEMP/baseline.tsv"
            echo "baseline: $(wc -l < "$RUNNER_TEMP/baseline.tsv" | tr -d ' ') files from $(jq -r '.synced_at' "$STATE_FILE")"
          else
            : > "$RUNNER_TEMP/baseline.tsv"
            echo "baseline: none (first run — will not overwrite any differing local file)"
          fi

          : > "$RUNNER_TEMP/to-update.txt"
          : > "$RUNNER_TEMP/kept-local.txt"
          : > "$RUNNER_TEMP/conflicts.txt"
          : > "$RUNNER_TEMP/ignored.txt"
          : > "$RUNNER_TEMP/derived.txt"
          : > "$RUNNER_TEMP/stamped.txt"

          while IFS=$'\t' read -r path up_sha; do
            # SKIP paths this mirror deliberately gitignores.
            #
            # Upstream can serve files the mirror excludes on purpose — the
            # digger extension publishes a `.private/` directory that its mirror
            # ignores. Downloading one is harmless; STAGING it is not: `git add`
            # refuses an ignored path and exits non-zero, which `xargs` reports
            # as 123 and the whole run fails. Verified on raycast-digger run
            # 30744504919 (2026-08-02) — and every scheduled run before it, which
            # is why the failure mails arrived daily.
            #
            # `--no-index` is REQUIRED and is the whole reason this guard works.
            # By default `git check-ignore` consults the index and reports a
            # TRACKED file as not-ignored, even when a .gitignore rule matches
            # it. digger's mirror force-added four files under `.private/`, so
            # the bare form returns false for exactly the paths this guard
            # exists to catch — the guard never fires and `git add` still dies.
            # `--no-index` asks the question we actually mean: does a rule match
            # this path? That is correct whether or not the file is tracked.
            #
            # Skipping is the correct resolution, not `git add -f`: the mirror's
            # .gitignore is a deliberate statement that this path does not belong
            # in this repo, and forcing it would commit exactly what was excluded.
            if git check-ignore -q --no-index -- "$path" 2>/dev/null; then
              printf '%s\n' "$path" >> "$RUNNER_TEMP/ignored.txt"
              continue
            fi

            # SKIP package-lock.json — it is DERIVED, not authored.
            #
            # A blob-SHA compare is the wrong instrument for a generated file.
            # A standalone mirror legitimately carries devDependencies the
            # monorepo copy does not (the fleet-wide
            # @ianvs/prettier-plugin-sort-imports, added 2026-07), so its lock
            # can NEVER equal upstream's — while upstream's lock keeps moving
            # under Raycast's dependency bots. Both sides therefore differ from
            # the baseline on every run, which the table above classifies as a
            # conflict, and the sync halts forever. Verified 2026-09-17: four
            # mirrors (bookface, tesla-energy, trimmy, wrap-unwrap) had been
            # failing daily since 2026-09-15 on exactly this, and no amount of
            # hand-reconciling would have cleared it — the next bot bump
            # recreates it.
            #
            # Taking upstream's lock is also wrong: it would drop the mirror's
            # own devDependencies and break `npm ci` here. The lock is a
            # function of package.json, so it is regenerated from package.json
            # instead — see the "Regenerate package-lock.json" step below.
            if [ "$path" = "package-lock.json" ]; then
              printf '%s\n' "$path" >> "$RUNNER_TEMP/derived.txt"
              continue
            fi

            base_sha=$(awk -F'\t' -v p="$path" '$1==p{print $2}' "$RUNNER_TEMP/baseline.tsv")
            # git hash-object gives the blob SHA of OUR copy, directly
            # comparable to upstream's. Missing file -> empty.
            mine_sha=""
            [ -f "$path" ] && mine_sha=$(git hash-object "$path")

            if [ "$up_sha" = "$mine_sha" ]; then
              continue                                    # identical, nothing to do
            fi

            upstream_moved=true
            mirror_moved=true
            [ -n "$base_sha" ] && [ "$base_sha" = "$up_sha" ]   && upstream_moved=false
            [ -n "$base_sha" ] && [ "$base_sha" = "$mine_sha" ] && mirror_moved=false

            if [ -z "$base_sha" ]; then
              # No baseline for this path. If we have no copy at all it is
              # simply new; if we DO have a differing copy, we cannot prove who
              # changed it, so keep ours (fail safe toward local work).
              if [ -z "$mine_sha" ]; then
                printf '%s\t%s\n' "$path" "$up_sha" >> "$RUNNER_TEMP/to-update.txt"
              else
                printf '%s\n' "$path" >> "$RUNNER_TEMP/kept-local.txt"
              fi
            elif [ "$upstream_moved" = true ] && [ "$mirror_moved" = true ]; then
              # AUTO-RESOLVE the {PR_MERGE_DATE} stamp before calling it a
              # conflict. Delivering that stamp is half of why this workflow
              # exists (see the header), yet it presents as a both-sides change:
              # we wrote the literal placeholder, Raycast CI substituted the
              # merge date. Upstream's copy is then OUR text with the date
              # filled in — nobody's work is at risk, and halting on it makes
              # the sync fail on exactly the event it was built to handle.
              # Verified 2026-09-17 on raycast-secret-browser-commands, halted
              # since 2026-09-15 on a CHANGELOG whose only difference was
              # `{PR_MERGE_DATE}` vs `2026-09-15`.
              #
              # The test is line-wise and EXACT, not a date mask. An earlier
              # draft masked every ISO date in both files and compared the
              # results, which was far too loose: two sides editing the same
              # OLD release date differently also compare equal under that
              # mask, and upstream would silently win. Here a line may differ
              # only if OUR line carries the placeholder and upstream's line is
              # that same line with a date where the placeholder is. Every
              # other line must match byte for byte, and the files must have
              # the same number of lines.
              if [ "$path" = "CHANGELOG.md" ] && grep -q '{PR_MERGE_DATE}' "$path"; then
                # Split out of the `if` chain on purpose. Inside it, a failed
                # curl is indistinguishable from "not a stamp", and the run
                # files a manual-reconcile issue for what was really a network
                # blip. Falling through to CONFLICT is still the right, safe
                # outcome — but it has to SAY that is what happened.
                if curl -fsSL --retry 3 --retry-delay 2 \
                     "https://raw.githubusercontent.com/${REPO}/${COMMIT}/extensions/${EXT_NAME}/${path}" \
                     -o "$RUNNER_TEMP/upstream-changelog"; then
                  if awk '
                    NR==FNR { mine[FNR]=$0; n=FNR; next }
                    FNR > n { exit 1 }
                    {
                      if ($0 == mine[FNR]) next
                      if (mine[FNR] !~ /\{PR_MERGE_DATE\}/) exit 1
                      stamped = $0
                      gsub(/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/, "{PR_MERGE_DATE}", stamped)
                      if (stamped != mine[FNR]) exit 1
                    }
                    END { if (FNR != n) exit 1 }
                  ' "$path" "$RUNNER_TEMP/upstream-changelog"; then
                    printf '%s\t%s\n' "$path" "$up_sha" >> "$RUNNER_TEMP/to-update.txt"
                    printf '%s\n' "$path" >> "$RUNNER_TEMP/stamped.txt"
                    continue
                  fi
                else
                  echo "  WARNING: could not fetch upstream CHANGELOG.md to test for the {PR_MERGE_DATE} stamp; treating as a conflict."
                fi
              fi
              printf '%s\n' "$path" >> "$RUNNER_TEMP/conflicts.txt"
            elif [ "$upstream_moved" = true ]; then
              printf '%s\t%s\n' "$path" "$up_sha" >> "$RUNNER_TEMP/to-update.txt"
            else
              printf '%s\n' "$path" >> "$RUNNER_TEMP/kept-local.txt"
            fi
          done < "$RUNNER_TEMP/upstream.tsv"

          # -- UPSTREAM DELETIONS ------------------------------------------
          #
          # The loop above only visits paths upstream serves NOW, so a file
          # upstream removed is never seen by it and would live in the mirror
          # forever. The blind workflow this one replaced did propagate
          # deletions, by diffing `git ls-files` against its download manifest;
          # dropping that was a silent capability regression carried since
          # 2026-08-03.
          #
          # The baseline makes this strictly better informed than that manifest
          # diff was. A path in the baseline and absent from upstream.tsv is an
          # unambiguous upstream deletion — no guessing from a file count. It
          # also needs none of the blind version's subdirectory scoping: the
          # baseline only ever contains paths upstream served, so a local-only
          # file (AGENTS.md, CLAUDE.md, .github/) is structurally incapable of
          # becoming a deletion candidate. That scoping existed to patch a
          # `git ls-files` scan that had no such guarantee, after karakeep run
          # 30651601868 (2026-07-31) removed package.json, tsconfig.json and
          # the workflow itself while reporting success.
          : > "$RUNNER_TEMP/to-delete.txt"
          : > "$RUNNER_TEMP/deleted-upstream-kept.txt"

          while IFS=$'\t' read -r path base_sha; do
            [ -n "$path" ] || continue
            # Still served upstream? Then it was not deleted.
            awk -F'\t' -v p="$path" '$1==p{f=1} END{exit !f}' "$RUNNER_TEMP/upstream.tsv" && continue
            # Derived, never compared — and so never deleted either. Without
            # this the baseline (rebuilt verbatim from upstream.tsv, lock
            # included) would let an upstream lockfile removal `git rm` the
            # mirror's own regenerated lock, which the compare step is
            # explicitly not allowed to touch.
            [ "$path" = "package-lock.json" ] && continue
            # Gitignored here, already gone, or never tracked: nothing to do.
            git check-ignore -q --no-index -- "$path" 2>/dev/null && continue
            [ -f "$path" ] || continue
            git ls-files --error-unmatch -- "$path" >/dev/null 2>&1 || continue

            if [ "$(git hash-object "$path")" = "$base_sha" ]; then
              printf '%s\n' "$path" >> "$RUNNER_TEMP/to-delete.txt"
            else
              # Upstream dropped it AND we changed it. Ambiguous, and the
              # fail-safe direction is the same as row 3 of the table above:
              # keep ours. It leaves the next baseline (which records what
              # upstream serves) and simply becomes a local-only file.
              printf '%s\n' "$path" >> "$RUNNER_TEMP/deleted-upstream-kept.txt"
            fi
          done < "$RUNNER_TEMP/baseline.tsv"

          # Refuse a mass deletion unattended. A legitimate upstream
          # restructure and a resolution bug that pointed at the wrong subtree
          # look identical here, and only one of them is recoverable from a
          # review. Fail closed and let a human look.
          DEL=$(wc -l < "$RUNNER_TEMP/to-delete.txt" | tr -d ' ')
          BASE_N=$(wc -l < "$RUNNER_TEMP/baseline.tsv" | tr -d ' ')
          if [ "$DEL" -gt 0 ] && [ "$BASE_N" -gt 0 ] && [ $((DEL * 2)) -gt "$BASE_N" ]; then
            echo "ABORT: $DEL of $BASE_N baseline files vanished upstream — refusing to propagate a deletion that large."
            exit 1
          fi

          UPD=$(wc -l < "$RUNNER_TEMP/to-update.txt" | tr -d ' ')
          KEPT=$(wc -l < "$RUNNER_TEMP/kept-local.txt" | tr -d ' ')
          CONF=$(wc -l < "$RUNNER_TEMP/conflicts.txt" | tr -d ' ')
          IGN=$(wc -l < "$RUNNER_TEMP/ignored.txt" | tr -d ' ')
          DELKEPT=$(wc -l < "$RUNNER_TEMP/deleted-upstream-kept.txt" | tr -d ' ')
          echo "take-upstream=$UPD  delete=$DEL  keep-local=$KEPT  conflicts=$CONF  gitignored=$IGN"
          # Say what was dropped. A silent skip reads as "covered everything".
          if [ "$IGN" -gt 0 ]; then echo "skipped (gitignored by this mirror):"; sed 's/^/    /' "$RUNNER_TEMP/ignored.txt"; fi
          if [ -s "$RUNNER_TEMP/derived.txt" ]; then echo "skipped (derived, regenerated locally):"; sed 's/^/    /' "$RUNNER_TEMP/derived.txt"; fi
          if [ -s "$RUNNER_TEMP/stamped.txt" ]; then echo "auto-resolved ({PR_MERGE_DATE} stamped upstream):"; sed 's/^/    /' "$RUNNER_TEMP/stamped.txt"; fi
          if [ "$KEPT" -gt 0 ]; then echo "kept (local-only edits, NOT reverted):"; sed 's/^/    /' "$RUNNER_TEMP/kept-local.txt"; fi
          if [ "$CONF" -gt 0 ]; then echo "CONFLICTS (both sides changed):";        sed 's/^/    /' "$RUNNER_TEMP/conflicts.txt"; fi
          if [ "$DEL" -gt 0 ]; then echo "removed (upstream no longer serves):";     sed 's/^/    /' "$RUNNER_TEMP/to-delete.txt"; fi
          if [ "$DELKEPT" -gt 0 ]; then echo "kept (upstream removed, changed here):"; sed 's/^/    /' "$RUNNER_TEMP/deleted-upstream-kept.txt"; fi

          {
            echo "updated=$UPD"
            echo "deleted=$DEL"
            echo "kept=$KEPT"
            echo "conflicts=$CONF"
          } >> "$GITHUB_OUTPUT"

      - name: Open an issue and stop, if any file changed on BOTH sides
        if: steps.compare.outputs.conflicts != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A file edited upstream AND locally cannot be reconciled by a script
          # without choosing whose work to discard. Sync NOTHING this run and
          # hand it to a human — a partial sync would be the confusing outcome.
          BODY=$(printf 'The upstream sync found files changed **both** upstream and in this mirror. It synced nothing, so no work was lost.\n\nConflicting files:\n\n%s\n\nUpstream commit: `%s`\n\nResolve by reconciling each file by hand, then re-run the workflow.\n' \
            "$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt")" \
            "${{ steps.compare.outputs.commit }}")

          # Reuse the open issue rather than filing a new one every cron tick.
          EXISTING=$(gh issue list --label upstream-sync --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create upstream-sync --color d93f0b --description "Upstream mirror sync" 2>/dev/null || true
            gh issue create --title "Upstream sync conflict — manual reconcile needed" \
              --label upstream-sync --body "$BODY"
          fi
          echo "::error::Sync halted: $(tr '\n' ' ' < "$RUNNER_TEMP/conflicts.txt")"
          exit 1

      - name: Download the files upstream actually changed
        if: steps.compare.outputs.updated != '0'
        shell: bash
        run: |
          set -euo pipefail
          EXT_NAME="${{ steps.meta.outputs.name }}"
          COMMIT="${{ steps.compare.outputs.commit }}"

          # Pinned to the resolved commit so every file comes from ONE
          # consistent snapshot, and from raw.githubusercontent (no API quota).
          while IFS=$'\t' read -r path sha; do
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/raycast/extensions/${COMMIT}/extensions/${EXT_NAME}/${path}" \
              -o "$path" || { echo "ABORT: failed to download $path"; exit 1; }

            # Verify we got the bytes upstream advertised. A truncated or
            # error-page response would otherwise be committed as content.
            GOT=$(git hash-object "$path")
            [ "$GOT" = "$sha" ] || { echo "ABORT: $path hash mismatch (want $sha, got $GOT)"; exit 1; }
            echo "  updated: $path"
          done < "$RUNNER_TEMP/to-update.txt"

      # The lock is excluded from the three-way compare (see the compare step),
      # so it has to be brought back into agreement with package.json here — and
      # ONLY when package.json actually moved. `npm install --package-lock-only`
      # re-resolves from package.json without touching node_modules or running
      # any package's install scripts, which is the whole job: it keeps this
      # mirror's own devDependencies AND picks up whatever upstream bumped.
      #
      # Skipping this would leave `npm ci` broken in the mirror the moment
      # upstream bumps @raycast/api, which is the common case.
      - name: Regenerate package-lock.json when package.json changed
        id: relock
        if: steps.compare.outputs.updated != '0'
        shell: bash
        run: |
          set -euo pipefail
          echo "regenerated=0" >> "$GITHUB_OUTPUT"
          cut -f1 "$RUNNER_TEMP/to-update.txt" | grep -qx 'package.json' || {
            echo "package.json unchanged; lock left alone."
            exit 0
          }
          # Must be present AND tracked AND not gitignored. The PR step stages
          # with a plain `git add`, which refuses an ignored path and exits
          # non-zero — the same failure mode that wedged raycast-digger daily in
          # 2026-08. A mirror that deliberately excludes its lock gets told, not
          # broken.
          if [ ! -f package-lock.json ]; then
            echo "No lock in this mirror; nothing to regenerate."; exit 0
          fi
          if git check-ignore -q --no-index -- package-lock.json 2>/dev/null ||
             ! git ls-files --error-unmatch -- package-lock.json >/dev/null 2>&1; then
            echo "::warning::package-lock.json is untracked or gitignored here; leaving it alone. It may now disagree with package.json."
            exit 0
          fi

          BEFORE=$(jq -r '.lockfileVersion' package-lock.json)
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          AFTER=$(jq -r '.lockfileVersion' package-lock.json)

          # `ubuntu-latest` floats, so the npm that runs here floats with it.
          # An image bump that changes the lockfile format would rewrite the
          # whole file and present it inside a content PR as if upstream had
          # done it. Refuse instead: a loud stop is recoverable, a silent
          # whole-file rewrite reviewed as "sync from upstream" is not.
          if [ "$BEFORE" != "$AFTER" ]; then
            git checkout -- package-lock.json
            echo "::error::npm rewrote lockfileVersion $BEFORE -> $AFTER. Refusing to bury a format migration in a sync PR — regenerate it locally and commit it yourself."
            exit 1
          fi

          if git diff --quiet -- package-lock.json; then
            echo "Lock already consistent with the new package.json."
            exit 0
          fi
          # Deliberately NOT appended to to-update.txt. That file means "taken
          # from upstream", it is what the PR body lists under that heading, and
          # its count was already fixed by the compare step. This lock was
          # GENERATED here; it gets staged and described separately.
          echo "regenerated=1" >> "$GITHUB_OUTPUT"
          echo "  regenerated: package-lock.json"

      - name: Record the new baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$STATE_FILE")"
          # Records what upstream serves NOW, so the next run can tell "upstream
          # changed it" from "I changed it". Without this the compare has no
          # third point and degrades to blind overwrite.
          jq -Rn --arg commit "${{ steps.compare.outputs.commit }}" \
                 --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                 --rawfile tsv "$RUNNER_TEMP/upstream.tsv" '
            {
              upstream_commit: $commit,
              synced_at: $ts,
              files: ($tsv | rtrimstr("\n") | split("\n")
                       | map(select(length > 0) | split("\t") | {(.[0]): .[1]})
                       | add // {})
            }' > "$RUNNER_TEMP/state.new"

          # `synced_at` changes on EVERY run, so writing this file unconditionally
          # would make it always differ from the committed copy — and, now that
          # recording is unconditional, produce a junk commit on every scheduled
          # run forever. Compare only the parts that carry meaning; when they
          # match, keep the committed file so the tree stays clean.
          if git show "HEAD:$STATE_FILE" > "$RUNNER_TEMP/state.old" 2>/dev/null &&
             [ "$(jq -S '{upstream_commit, files}' "$RUNNER_TEMP/state.old")" = \
               "$(jq -S '{upstream_commit, files}' "$RUNNER_TEMP/state.new")" ]; then
            cp "$RUNNER_TEMP/state.old" "$STATE_FILE"
            echo "baseline already current ($(jq '.files | length' "$STATE_FILE") files); timestamp left untouched"
          else
            cp "$RUNNER_TEMP/state.new" "$STATE_FILE"
            echo "recorded $(jq '.files | length' "$STATE_FILE") files"
          fi

      # When files WERE copied, the PR step below stages the baseline alongside
      # them, so it only needs its own commit when there is no PR to ride on.
      # Restricted to the default branch on purpose. workflow_dispatch can be
      # fired against any ref — another branch, or a tag, where a push would
      # either fail or land somewhere nobody expects. The baseline only ever
      # describes the mirror's mainline, so a run from anywhere else computes it
      # and stops.
      - name: Commit the refreshed baseline when no PR will carry it
        if: >-
          steps.compare.outputs.updated == '0' &&
          steps.compare.outputs.deleted == '0' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          set -euo pipefail
          # status, not diff: on a mirror's first run the state file is untracked,
          # and `git diff` never sees untracked files.
          if [ -z "$(git status --porcelain -- "$STATE_FILE")" ]; then
            echo "Baseline already current; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage ONLY the bookkeeping file. No extension source moves here, so
          # this does not weaken the rule that merging a PR is the only thing
          # that writes upstream CONTENT to main.
          git add -- "$STATE_FILE"
          git commit -m "chore: record upstream sync baseline ${{ steps.compare.outputs.commit }}"
          # A rejected push (main moved mid-run) fails the job on purpose — the
          # next scheduled run recomputes and retries. Swallowing it here would
          # recreate the silent staleness this step exists to prevent.
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Open a pull request
        if: >-
          steps.compare.outputs.updated != '0' ||
          steps.compare.outputs.deleted != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage ONLY what this run touched. `git add -A` would sweep in
          # anything else present in the tree.
          if [ -s "$RUNNER_TEMP/to-update.txt" ]; then
            cut -f1 "$RUNNER_TEMP/to-update.txt" | tr '\n' '\0' | xargs -0 git add --
          fi
          # Propagate the upstream deletions computed in the compare step. They
          # ride the PR like every other content change — nothing removes a
          # tracked file from main without a review.
          if [ -s "$RUNNER_TEMP/to-delete.txt" ]; then
            tr '\n' '\0' < "$RUNNER_TEMP/to-delete.txt" | xargs -0 git rm -q --
          fi
          if [ "${{ steps.relock.outputs.regenerated }}" = "1" ]; then
            git add -- package-lock.json
          fi
          git add -- "$STATE_FILE"

          if git diff --cached --quiet; then
            echo "Nothing staged; no PR needed."
            exit 0
          fi

          BRANCH="sync/upstream-${{ steps.compare.outputs.commit }}"
          BRANCH="${BRANCH:0:60}"

          # An open PR for this exact upstream commit already covers this run.
          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "PR already open for $BRANCH"
            exit 0
          fi

          # Reuse the branch if a previous run already pushed it. The failure this
          # guards is real: on 2026-08-27 raycast-store-updates run 33111251375
          # pushed this branch and THEN had `gh pr create` refused ("GitHub Actions
          # is not permitted to create or approve pull requests"), leaving a branch
          # with no PR. Every run after re-derived the same commit-keyed name, made
          # a fresh commit, and died on non-fast-forward — wedged for six days.
          #
          # Not `--force`: the guard above only sees OPEN PRs, so a closed-but-
          # undeleted PR, or a manual commit someone pushed onto this branch to fix
          # it up, would be silently overwritten. And `set -e` does not cover that
          # `gh | grep` guard — it is an `if` test, which bash exempts from errexit,
          # so an API blip reads as "no open PR" exactly when force must not fire.
          if [ -n "$(git ls-remote --heads origin "refs/heads/$BRANCH")" ]; then
            echo "Branch $BRANCH already pushed; creating its missing PR."
          else
            git switch -c "$BRANCH"
            git commit -m "chore: sync from upstream raycast/extensions"
            git push -u origin "$BRANCH"
          fi

          KEPT_NOTE=""
          if [ "${{ steps.compare.outputs.kept }}" != "0" ]; then
            KEPT_NOTE=$(printf '\n### Local edits preserved\n\nThese differ from upstream because they were changed **here**. This PR leaves them alone:\n\n%s\n' \
              "$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/kept-local.txt")")
          fi

          DEL_NOTE=""
          if [ -s "$RUNNER_TEMP/to-delete.txt" ]; then
            DEL_NOTE=$(printf '\n### Removed (upstream no longer serves them)\n\n%s\n' \
              "$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/to-delete.txt")")
          fi
          if [ -s "$RUNNER_TEMP/deleted-upstream-kept.txt" ]; then
            DEL_KEPT=$(printf '\n### Removed upstream, but KEPT here\n\nUpstream dropped these and they were also changed in this mirror, so they were left alone and are now local-only:\n\n%s\n' \
              "$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/deleted-upstream-kept.txt")")
            DEL_NOTE="${DEL_NOTE}${DEL_KEPT}"
          fi

          LOCK_NOTE=""
          if [ "${{ steps.relock.outputs.regenerated }}" = "1" ]; then
            LOCK_NOTE=$(printf '\n### Regenerated here (not taken from upstream)\n\n- `package-lock.json` — re-resolved from the new `package.json` with `npm install --package-lock-only`. The mirror lock is never compared against the monorepo copy; it carries devDependencies upstream does not.\n')
          fi

          PR_REF=""
          if [ -n "${{ github.event.client_payload.pr_number }}" ]; then
            PR_REF=$(printf '\nTriggered by raycast/extensions#%s.' "${{ github.event.client_payload.pr_number }}")
          fi

          BODY=$(printf 'Brings this mirror up to date with the merged monorepo state.\n\nUpstream commit: [`%s`](https://github.com/raycast/extensions/commit/%s)%s\n\n### Files taken from upstream (%s)\n\n%s\n%s%s\n---\n\nOpened automatically. Merging this PR is the only thing that writes to `main` — review the diff and merge when it looks right. If it contains someone else'"'"'s contribution, credit them in `CHANGELOG.md` before merging.\n' \
            "${{ steps.compare.outputs.commit }}" \
            "${{ steps.compare.outputs.commit }}" \
            "$PR_REF" \
            "${{ steps.compare.outputs.updated }}" \
            "$(cut -f1 "$RUNNER_TEMP/to-update.txt" | sed 's/^/- `/; s/$/`/')" \
            "$DEL_NOTE" \
            "${KEPT_NOTE}${LOCK_NOTE}")

          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "chore: sync from upstream raycast/extensions" --body "$BODY"

      - name: Report when nothing changed
        if: >-
          steps.compare.outputs.updated == '0' &&
          steps.compare.outputs.deleted == '0' &&
          steps.compare.outputs.conflicts == '0'
        run: |
          echo "Mirror is up to date with upstream."
          echo "Local-only edits preserved: ${{ steps.compare.outputs.kept }}"
