name: Sync from upstream

# STUB — the sync logic lives in ONE place, the reusable workflow at
# chrismessina/raycast-extensions-skills/.github/workflows/sync-from-upstream.yml,
# and every mirror calls it at @main. Fix bugs THERE; never edit a mirror's stub
# by hand. Install or refresh this file with
# plugins/raycast-extensions/scripts/setup-mirror.sh [--update], which keeps the
# cron minute and the upstream_ext_dir override below.
#
# Reconciles a standalone mirror against the merged monorepo state: the stamped
# {PR_MERGE_DATE}, recompressed screenshots, and any change a contributor
# merged upstream. Extension content reaches main only through a pull request.

on:
  # The cron is the SAFETY NET: someone else's PR to your extension merging
  # upstream is exactly when a mirror drifts unnoticed. setup-mirror.sh
  # staggers the minute per repo, since GitHub queues same-minute schedules.
  schedule:
    - cron: "20 9 * * *"
  # Fired by the post-merge step (or `gh workflow run`) for an immediate sync.
  repository_dispatch:
    types: [upstream-sync]
  workflow_dispatch:
    inputs:
      ext_dir:
        description: "Override monorepo directory name (extensions/<ext_dir>) if it differs from package.json name"
        required: false

jobs:
  sync:
    # A called workflow can use at most the permissions its caller grants.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: chrismessina/raycast-extensions-skills/.github/workflows/sync-from-upstream.yml@main
    with:
      ext_dir: ${{ inputs.ext_dir || '' }}
      upstream_ext_dir: ""
